name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Continue even if dependency graph is not enabled
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      id: dependency-review
      continue-on-error: true
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        comment-summary-in-pr: true

    - name: Comment on PR if dependency graph not enabled
      if: failure() && steps.dependency-review.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `⚠️ **Dependency Review could not run**

            The Dependency Graph feature is not enabled for this repository.

            To enable it:
            1. Go to: Settings → Security & analysis
            2. Enable "Dependency graph"

            This feature helps detect vulnerable dependencies in pull requests.

            [Learn more about Dependency Graph](https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-the-dependency-graph)`
          })
